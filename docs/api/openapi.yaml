openapi: 3.1.0
info:
  title: Exabyte API
  version: 1.0.0
  description: Contrato inicial de rutas REST implementadas en Laravel.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      description: Limitado actualmente a cinco solicitudes por minuto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Access token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in, user]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                  refresh_expires_in:
                    type: integer
                  user:
                    $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Límite de solicitudes alcanzado.
  /auth/refresh:
    post:
      summary: Rotar refresh token y emitir un nuevo par de tokens
      description: Un refresh token se puede usar una sola vez. Su reuso revoca la familia completa de sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  minLength: 64
                  maxLength: 64
      responses:
        "200":
          description: Nuevo par de tokens.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                  refresh_expires_in:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Límite de solicitudes alcanzado.
  /auth/me:
    get:
      summary: Obtener usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/logout:
    post:
      summary: Revocar la sesión autenticada
      description: Revoca la familia de refresh tokens asociada y sus access tokens.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: La sesión actual fue revocada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /companies:
    get:
      summary: Listar empresas del usuario
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empresas en las que el usuario tiene membresía.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Crear empresa y asignar owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 160
      responses:
        "201":
          description: Empresa creada con membership owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CompanyMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /companies/{company}/members:
    parameters:
      - name: company
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Listar miembros de una empresa
      description: Requiere ser owner de la empresa. Las empresas ajenas responden 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membresías ordenadas por nombre.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: El actor pertenece a la empresa, pero no es owner.
        "404":
          description: Empresa no disponible.
  /companies/{company}/members/{member}:
    parameters:
      - name: company
        in: path
        required: true
        schema:
          type: integer
      - name: member
        in: path
        required: true
        schema:
          type: integer
    patch:
      summary: Cambiar rol de un miembro existente
      description: Solo owner puede ejecutar. No permite asignar owner ni modificar la membresía owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [manager, member]
      responses:
        "200":
          description: Rol actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CompanyMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: El actor no es owner de la empresa.
        "404":
          description: Empresa o membresía no disponible.
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Quitar un miembro existente
      description: Solo owner puede ejecutar. La membresía owner no puede eliminarse con este endpoint.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Membresía eliminada.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: El actor no es owner de la empresa.
        "404":
          description: Empresa o membresía no disponible.
        "422":
          $ref: "#/components/responses/ValidationError"
  /categories:
    get:
      summary: Listar categorías
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          description: Selector de empresa; el servidor verifica la membresía del usuario.
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        "200":
          description: Página de categorías en formato de paginación Laravel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                  links:
                    type: object
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "400":
          description: Falta una empresa activa válida.
        "404":
          description: El usuario no pertenece a la empresa seleccionada.
        "402":
          description: No existe una suscripción vigente ni una excepción legacy aplicable.
        "403":
          description: El plan no incluye la funcionalidad solicitada.
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear categoría
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          description: Selector de empresa; el servidor verifica la membresía del usuario.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                description:
                  type: [string, "null"]
                  maxLength: 2000
      responses:
        "201":
          description: Categoría creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "400":
          description: Falta una empresa activa válida.
        "404":
          description: El usuario no pertenece a la empresa seleccionada.
        "403":
          description: El rol no permite crear categorías o el plan no incluye el entitlement catalog.
        "402":
          description: No existe una suscripción vigente ni una excepción legacy aplicable.
        "422":
          $ref: "#/components/responses/ValidationError"
  /reports/sales:
    get:
      summary: Resumen de ventas para el período
      description: >
        Resumen agregado de ventas válidas, devoluciones, anulaciones, neto y
        ticket promedio, aislado por la empresa activa. Por defecto usa los
        últimos 30 días incluyendo hoy. Las devoluciones se contabilizan por
        la fecha en que se registraron.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          description: Selector de empresa; el servidor verifica la membresía del usuario.
          schema:
            type: integer
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Totales monetarios expresados como cadenas decimales con dos posiciones.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SalesSummary"
        "400":
          description: Falta una empresa activa válida.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: El usuario no pertenece a la empresa seleccionada.
        "402":
          description: No existe una suscripción vigente ni una excepción legacy aplicable.
        "403":
          description: El plan no incluye sales_reports.
        "422":
          $ref: "#/components/responses/ValidationError"
  /reports/inventory:
    get:
      summary: Resumen de inventario y movimientos
      description: >
        Totales de productos activos y saldos con stock actual, junto con el
        conteo de movimientos del período. Aislado por empresa activa.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Inventario actual y movimientos en el período indicado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/InventorySummary"
        "400":
          description: Falta una empresa activa válida.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: El usuario no pertenece a la empresa seleccionada.
        "402":
          description: No existe una suscripción vigente ni una excepción legacy aplicable.
        "403":
          description: El plan no incluye inventory_reports.
        "422":
          $ref: "#/components/responses/ValidationError"
  /reports/cash:
    get:
      summary: Resumen de cajas y arqueos
      description: >
        Totales de sesiones abiertas durante el período, ventas, devoluciones
        y conciliación de efectivo. El efectivo contado y la diferencia solo
        consideran sesiones cerradas. Aislado por empresa activa.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumen de caja para el período indicado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CashSummary"
        "400":
          description: Falta una empresa activa válida.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: El usuario no pertenece a la empresa seleccionada.
        "402":
          description: No existe una suscripción vigente ni una excepción legacy aplicable.
        "403":
          description: El plan no incluye cash_reports.
        "422":
          $ref: "#/components/responses/ValidationError"
  /sales/{sale}/returns:
    parameters:
      - name: sale
        in: path
        required: true
        schema:
          type: integer
      - name: X-Company-ID
        in: header
        required: true
        description: Selector de empresa; el servidor verifica la membresía del usuario.
        schema:
          type: integer
    post:
      summary: Registrar una devolución parcial o total
      description: >
        Requiere owner o manager y una caja abierta. El servidor valida las
        cantidades restantes, calcula el reintegro desde los importes originales,
        repone existencias y descuenta efectivo dentro de una transacción.
        La clave de idempotencia hace seguro repetir la misma solicitud.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason, idempotency_key]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [sale_item_id, quantity]
                    properties:
                      sale_item_id:
                        type: integer
                      quantity:
                        type: string
                        pattern: "^[0-9]+(\\.[0-9]{1,3})?$"
                reason:
                  type: string
                  maxLength: 500
                idempotency_key:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Devolución registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data, replayed]
                properties:
                  data:
                    $ref: "#/components/schemas/SaleReturn"
                  replayed:
                    type: boolean
                    const: false
        "200":
          description: Solicitud repetida con la misma clave y contenido.
          content:
            application/json:
              schema:
                type: object
                required: [data, replayed]
                properties:
                  data:
                    $ref: "#/components/schemas/SaleReturn"
                  replayed:
                    type: boolean
                    const: true
        "400":
          description: Falta una empresa activa válida.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: El rol del miembro no permite devoluciones; se requiere owner o manager.
        "404":
          description: Venta no disponible para la empresa seleccionada.
        "409":
          description: No hay caja abierta o la venta no admite devoluciones.
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/register:
    post:
      summary: Registrar una cuenta y su primera empresa
      description: Limitado a tres solicitudes por minuto. La cuenta y la membresía owner se crean en una transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, company_name]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                password_confirmation: { type: string, format: password }
                company_name: { type: string, maxLength: 160 }
      responses:
        "201":
          description: Cuenta creada con sesión activa y empresa inicial.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, user, company]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
                  company: { $ref: "#/components/schemas/CompanyMembership" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Límite de solicitudes alcanzado.
  /plans:
    get:
      summary: Listar planes disponibles
      description: Devuelve únicamente planes activos y precios en ARS.
      responses:
        "200":
          description: Planes públicos disponibles para nuevas contrataciones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Plan" }
  /companies/{company}/subscription:
    parameters:
      - name: company
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Consultar suscripción y pagos de la empresa
      description: Requiere autenticación JWT y membresía owner de la empresa.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Suscripción más reciente o null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Subscription"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Se requiere el rol owner.
        "404":
          description: Empresa no disponible para el usuario.
    post:
      summary: Crear o continuar una contratación
      description: El precio y snapshot contractual se obtienen del plan guardado en el servidor; el checkout se procesa en Mercado Pago.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, billing_period]
              properties:
                plan_id: { type: integer }
                billing_period: { type: string, enum: [monthly, annual] }
      responses:
        "201":
          description: Suscripción pendiente y enlace alojado de checkout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Subscription" }
                  checkout_url: { type: [string, "null"], format: uri }
        "200":
          description: Se reanudó la contratación pendiente existente.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Se requiere el rol owner.
        "409":
          description: Ya existe otra contratación activa o pendiente.
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Mercado Pago no pudo iniciar el checkout.
        "503":
          description: La integración de Mercado Pago no está configurada.
    delete:
      summary: Cancelar la suscripción de la empresa
      description: Cancela inmediatamente la autorización recurrente; conserva el historial financiero.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Suscripción cancelada.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Se requiere el rol owner.
  /payments/mercadopago/webhook:
    post:
      summary: Recibir una notificación firmada de Mercado Pago
      description: Valida la firma oficial, guarda una referencia mínima e idempotente y encola el procesamiento.
      parameters:
        - name: x-signature
          in: header
          required: true
          schema: { type: string }
        - name: x-request-id
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notificación recibida (incluidas las duplicadas).
        "401":
          description: Firma inválida.
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: El secreto de firma no está configurado.
  /platform/plans:
    get:
      summary: Listar todos los planes para Superadmin
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Planes activos e inactivos.
    post:
      summary: Crear un plan comercial
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanWrite" }
      responses:
        "201":
          description: Plan creado y evento auditado.
        "403":
          description: Se requiere autorización Superadmin.
        "422":
          $ref: "#/components/responses/ValidationError"
  /platform/plans/{plan}:
    put:
      summary: Actualizar un plan comercial
      description: Cambios contractuales incrementan terms_version; los snapshots existentes no se reescriben.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: plan
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanWrite" }
      responses:
        "200":
          description: Plan actualizado y acción auditada.
        "403":
          description: Se requiere autorización Superadmin.
        "422":
          $ref: "#/components/responses/ValidationError"
  /platform/subscriptions:
    get:
      summary: Consultar suscripciones para Superadmin
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, trialing, active, past_due, grace, suspended, canceled, expired] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Página de contratos, empresas, titulares y últimos intentos de pago.
        "403":
          description: Se requiere autorización Superadmin.
  /platform/payments:
    get:
      summary: Consultar intentos de pago para Superadmin
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, failed, canceled] }
        - name: kind
          in: query
          schema: { type: string, enum: [initial, renewal, change] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Página de operaciones sin los datos internos del proveedor.
        "403":
          description: Se requiere autorización Superadmin.
  /platform/metrics:
    get:
      summary: Consultar métricas comerciales para Superadmin
      description: Ingresos cobrados son pagos pagados con paid_at; el MRR es solo una estimación normalizada desde contratos activos.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Conteos, ingresos cobrados, estimación recurrente y distribución por plan y estado.
        "403":
          description: Se requiere autorización Superadmin.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Plan:
      type: object
      required:
        - id
        - code
        - name
        - currency
        - monthly_amount
        - annual_amount
        - limits
        - entitlements
        - terms_version
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        benefits:
          type: array
          items: { type: string }
        currency: { type: string, const: ARS }
        monthly_amount: { type: string }
        annual_amount: { type: string }
        limits:
          type: object
          additionalProperties: { type: [integer, "null"] }
        entitlements:
          type: object
          additionalProperties: { type: boolean }
        trial_days: { type: integer }
        grace_days: { type: integer }
        terms_version: { type: integer }
        is_active: { type: boolean }
    PlanWrite:
      type: object
      required:
        - code
        - name
        - benefits
        - currency
        - monthly_amount
        - annual_amount
        - limits
        - entitlements
        - trial_days
        - grace_days
        - is_active
      properties:
        code: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }
        benefits:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 240 }
        currency: { type: string, const: ARS }
        monthly_amount: { type: number, exclusiveMinimum: 0 }
        annual_amount: { type: number, exclusiveMinimum: 0 }
        limits:
          type: object
          required: [users, branches, cash_registers]
          properties:
            users: { type: integer, minimum: 1 }
            branches: { type: integer, minimum: 1 }
            cash_registers: { type: integer, minimum: 1 }
            products: { type: [integer, "null"], minimum: 1 }
        entitlements:
          type: object
          additionalProperties: { type: boolean }
        trial_days: { type: integer, const: 0 }
        grace_days: { type: integer, minimum: 0, maximum: 90 }
        is_active: { type: boolean }
    Subscription:
      type: object
      required: [id, company_id, billing_user_id, plan_id, terms_snapshot, billing_period, status]
      properties:
        id: { type: integer }
        company_id: { type: integer }
        billing_user_id: { type: integer }
        plan_id: { type: integer }
        terms_snapshot: { type: object }
        billing_period: { type: string, enum: [monthly, annual] }
        status: { type: string, enum: [pending, trialing, active, past_due, grace, suspended, canceled, expired] }
        provider_status: { type: [string, "null"] }
        checkout_url: { type: [string, "null"], format: uri }
        current_period_end: { type: [string, "null"], format: date-time }
        canceled_at: { type: [string, "null"], format: date-time }
        payment_attempts:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              kind: { type: string }
              status: { type: string }
              amount: { type: string }
              currency: { type: string }
              provider_status: { type: [string, "null"] }
              paid_at: { type: [string, "null"], format: date-time }
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
    Category:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
          nullable: true
        name:
          type: string
        description:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    CompanyMembership:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          description: owner administra la empresa; manager y owner pueden crear categorías; member solo puede consultarlas.
          enum: [owner, manager, member]
    CompanyMember:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, manager, member]
    SaleReturn:
      type: object
      required: [id, sale_id, cash_session_id, reason, total, items]
      properties:
        id:
          type: integer
        sale_id:
          type: integer
        cash_session_id:
          type: integer
        reason:
          type: string
        total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        items:
          type: array
          items:
            type: object
            required: [sale_item_id, product_id, quantity, refund_amount]
            properties:
              sale_item_id:
                type: integer
              product_id:
                type: integer
              quantity:
                type: string
                pattern: "^[0-9]+\\.[0-9]{3}$"
              refund_amount:
                type: string
                pattern: "^[0-9]+\\.[0-9]{2}$"
    SalesSummary:
      type: object
      required:
        - from
        - to
        - sales_count
        - sales_total
        - returns_count
        - returns_total
        - voided_count
        - voided_total
        - net_sales
        - average_ticket
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        sales_count:
          type: integer
        sales_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        returns_count:
          type: integer
        returns_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        voided_count:
          type: integer
        voided_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        net_sales:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
        average_ticket:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
    InventorySummary:
      type: object
      required:
        - from
        - to
        - products_count
        - active_products_count
        - products_with_stock
        - out_of_stock_products
        - movements
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        products_count:
          type: integer
        active_products_count:
          type: integer
        products_with_stock:
          type: integer
        out_of_stock_products:
          type: integer
        movements:
          type: object
          required: [adjustment, sale, sale_void, sale_return]
          properties:
            adjustment:
              type: integer
            sale:
              type: integer
            sale_void:
              type: integer
            sale_return:
              type: integer
    CashSummary:
      type: object
      required:
        - from
        - to
        - sessions_count
        - closed_sessions_count
        - opening_total
        - sales_total
        - returns_total
        - expected_cash_total
        - counted_cash_total
        - difference_total
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        sessions_count:
          type: integer
        closed_sessions_count:
          type: integer
        opening_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        sales_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        returns_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        expected_cash_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        counted_cash_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        difference_total:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Unauthenticated:
      description: Bearer token ausente, inválido, vencido o revocado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Error de validación Laravel.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
