openapi: 3.1.0
info:
  title: Exabyte API
  version: 1.0.0
  description: Contrato inicial de rutas REST implementadas en Laravel.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      description: Limitado actualmente a cinco solicitudes por minuto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Access token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in, user]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                  refresh_expires_in:
                    type: integer
                  user:
                    $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Límite de solicitudes alcanzado.
  /auth/refresh:
    post:
      summary: Rotar refresh token y emitir un nuevo par de tokens
      description: Un refresh token se puede usar una sola vez. Su reuso revoca la familia completa de sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  minLength: 64
                  maxLength: 64
      responses:
        "200":
          description: Nuevo par de tokens.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                  refresh_expires_in:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Límite de solicitudes alcanzado.
  /auth/me:
    get:
      summary: Obtener usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/logout:
    post:
      summary: Revocar la sesión autenticada
      description: Revoca la familia de refresh tokens asociada y sus access tokens.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: La sesión actual fue revocada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /companies:
    get:
      summary: Listar empresas del usuario
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empresas en las que el usuario tiene membresía.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Crear empresa y asignar owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 160
      responses:
        "201":
          description: Empresa creada con membership owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CompanyMembership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
  /companies/{company}/members:
    parameters:
      - name: company
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Listar miembros de una empresa
      description: Requiere ser owner de la empresa. Las empresas ajenas responden 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membresías ordenadas por nombre.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: El actor pertenece a la empresa, pero no es owner.
        "404":
          description: Empresa no disponible.
  /companies/{company}/members/{member}:
    parameters:
      - name: company
        in: path
        required: true
        schema:
          type: integer
      - name: member
        in: path
        required: true
        schema:
          type: integer
    patch:
      summary: Cambiar rol de un miembro existente
      description: Solo owner puede ejecutar. No permite asignar owner ni modificar la membresía owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [manager, member]
      responses:
        "200":
          description: Rol actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CompanyMember"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: El actor no es owner de la empresa.
        "404":
          description: Empresa o membresía no disponible.
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Quitar un miembro existente
      description: Solo owner puede ejecutar. La membresía owner no puede eliminarse con este endpoint.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Membresía eliminada.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: El actor no es owner de la empresa.
        "404":
          description: Empresa o membresía no disponible.
        "422":
          $ref: "#/components/responses/ValidationError"
  /categories:
    get:
      summary: Listar categorías
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          description: Selector de empresa; el servidor verifica la membresía del usuario.
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        "200":
          description: Página de categorías en formato de paginación Laravel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                  links:
                    type: object
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "400":
          description: Falta una empresa activa válida.
        "404":
          description: El usuario no pertenece a la empresa seleccionada.
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear categoría
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          description: Selector de empresa; el servidor verifica la membresía del usuario.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                description:
                  type: [string, "null"]
                  maxLength: 2000
      responses:
        "201":
          description: Categoría creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "400":
          description: Falta una empresa activa válida.
        "404":
          description: El usuario no pertenece a la empresa seleccionada.
        "403":
          description: El rol del miembro no permite crear categorías; se requiere owner o manager.
        "422":
          $ref: "#/components/responses/ValidationError"
  /reports/sales:
    get:
      summary: Resumen de ventas para el período
      description: >
        Resumen agregado de ventas válidas, devoluciones, anulaciones, neto y
        ticket promedio, aislado por la empresa activa. Por defecto usa los
        últimos 30 días incluyendo hoy. Las devoluciones se contabilizan por
        la fecha en que se registraron.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          description: Selector de empresa; el servidor verifica la membresía del usuario.
          schema:
            type: integer
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Totales monetarios expresados como cadenas decimales con dos posiciones.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SalesSummary"
        "400":
          description: Falta una empresa activa válida.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: El usuario no pertenece a la empresa seleccionada.
        "422":
          $ref: "#/components/responses/ValidationError"
  /sales/{sale}/returns:
    parameters:
      - name: sale
        in: path
        required: true
        schema:
          type: integer
      - name: X-Company-ID
        in: header
        required: true
        description: Selector de empresa; el servidor verifica la membresía del usuario.
        schema:
          type: integer
    post:
      summary: Registrar una devolución parcial o total
      description: >
        Requiere owner o manager y una caja abierta. El servidor valida las
        cantidades restantes, calcula el reintegro desde los importes originales,
        repone existencias y descuenta efectivo dentro de una transacción.
        La clave de idempotencia hace seguro repetir la misma solicitud.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason, idempotency_key]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [sale_item_id, quantity]
                    properties:
                      sale_item_id:
                        type: integer
                      quantity:
                        type: string
                        pattern: "^[0-9]+(\\.[0-9]{1,3})?$"
                reason:
                  type: string
                  maxLength: 500
                idempotency_key:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Devolución registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data, replayed]
                properties:
                  data:
                    $ref: "#/components/schemas/SaleReturn"
                  replayed:
                    type: boolean
                    const: false
        "200":
          description: Solicitud repetida con la misma clave y contenido.
          content:
            application/json:
              schema:
                type: object
                required: [data, replayed]
                properties:
                  data:
                    $ref: "#/components/schemas/SaleReturn"
                  replayed:
                    type: boolean
                    const: true
        "400":
          description: Falta una empresa activa válida.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: El rol del miembro no permite devoluciones; se requiere owner o manager.
        "404":
          description: Venta no disponible para la empresa seleccionada.
        "409":
          description: No hay caja abierta o la venta no admite devoluciones.
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
    Category:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
          nullable: true
        name:
          type: string
        description:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    CompanyMembership:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          description: owner administra la empresa; manager y owner pueden crear categorías; member solo puede consultarlas.
          enum: [owner, manager, member]
    CompanyMember:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, manager, member]
    SaleReturn:
      type: object
      required: [id, sale_id, cash_session_id, reason, total, items]
      properties:
        id:
          type: integer
        sale_id:
          type: integer
        cash_session_id:
          type: integer
        reason:
          type: string
        total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        items:
          type: array
          items:
            type: object
            required: [sale_item_id, product_id, quantity, refund_amount]
            properties:
              sale_item_id:
                type: integer
              product_id:
                type: integer
              quantity:
                type: string
                pattern: "^[0-9]+\\.[0-9]{3}$"
              refund_amount:
                type: string
                pattern: "^[0-9]+\\.[0-9]{2}$"
    SalesSummary:
      type: object
      required:
        - from
        - to
        - sales_count
        - sales_total
        - returns_count
        - returns_total
        - voided_count
        - voided_total
        - net_sales
        - average_ticket
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        sales_count:
          type: integer
        sales_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        returns_count:
          type: integer
        returns_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        voided_count:
          type: integer
        voided_total:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        net_sales:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
        average_ticket:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Unauthenticated:
      description: Bearer token ausente, inválido, vencido o revocado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Error de validación Laravel.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
